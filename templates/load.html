<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load environment and agent — RL Trainer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <h1 class="page-title page-title--centered">Load environment and agent</h1>

  <p class="nav-actions">
    <a class="nav-button" href="{{ url_for('index') }}">Back to main page</a>
  </p>

  <div class="load-panel">
    <div class="load-row">
      <label class="load-label load-label--blue" for="environment">Select environment:</label>
      <select id="environment" name="environment" class="load-select">
        <optgroup label="Toy Text">
          <option value="Blackjack-v1">Blackjack</option>
          <option value="Taxi-v3">Taxi</option>
          <option value="FrozenLake-v1">Frozen Lake</option>
          <option value="CliffWalking-v0">Cliff Walking</option>
        </optgroup>
        <optgroup label="Classic Control">
          <option value="Acrobot-v1">Acrobot</option>
          <option value="CartPole-v1">CartPole</option>
          <option value="MountainCar-v0">Mountain Car</option>
          <option value="MountainCarContinuous-v0">Continuous Mountain Car</option>
          <option value="Pendulum-v1">Pendulum</option>
        </optgroup>
      </select>
    </div>

    <div class="load-row">
      <label class="load-label load-label--blue" for="agent">Select agent:</label>
      <select id="agent" name="agent" class="load-select">
        <optgroup label="Tabular agents">
          <option value="MC">MC</option>
          <option value="SARSA">SARSA</option>
          <option value="Q_learning">Q-learning</option>
        </optgroup>
        <optgroup label="DRL agents from stable baselines 3">
          <option value="drl-sb3">DRL agents from stable baselines 3</option>
        </optgroup>
      </select>
    </div>

    <div class="load-row load-row--hyperparams">
      <span class="load-label load-label--red">Hyperparameters:</span>
      <div class="hyperparams-panel">
        <div class="hyperparam">
          Number of states:
          <span id="num-states" class="hyperparam-value"></span>
        </div>
        <div class="hyperparam">
          <label for="learning-rate">Learning rate:</label>
          <input
            type="number"
            id="learning-rate"
            name="learning_rate"
            class="hyperparam-input"
            value="0.1"
            min="0"
            max="1"
            step="0.01"
          >
        </div>
        <div class="hyperparam">
          Number of actions:
          <span id="num-actions" class="hyperparam-value"></span>
        </div>
        <div class="hyperparam">
          <label for="exploration-probability">Exploration probability:</label>
          <input
            type="number"
            id="exploration-probability"
            name="exploration_probability"
            class="hyperparam-input"
            value="0.1"
            min="0"
            max="1"
            step="0.01"
          >
        </div>
      </div>
    </div>

    <div class="load-actions">
      <button type="button" class="action-button" id="save-selections">Save selections</button>
      <button type="button" class="action-button action-button--secondary" id="reset-defaults">Reset defaults</button>
      <span id="save-status" class="save-status" aria-live="polite"></span>
    </div>
  </div>

  <script>
    const envSpaces = {{ env_spaces | tojson }};
    const savedConfig = {{ config | tojson }};
    const defaultConfig = {{ default_config | tojson }};
    const environmentSelect = document.getElementById("environment");
    const agentSelect = document.getElementById("agent");
    const learningRateInput = document.getElementById("learning-rate");
    const explorationInput = document.getElementById("exploration-probability");
    const numStates = document.getElementById("num-states");
    const numActions = document.getElementById("num-actions");
    const saveStatus = document.getElementById("save-status");

    function updateHyperparameters() {
      const spec = envSpaces[environmentSelect.value];
      if (!spec) {
        numStates.textContent = "";
        numActions.textContent = "";
        return;
      }
      numStates.textContent = spec.states;
      numActions.textContent = spec.actions;
    }

    function applyConfig(config) {
      environmentSelect.value = config.environment;
      agentSelect.value = config.agent;
      learningRateInput.value = config.learning_rate;
      explorationInput.value = config.exploration_probability;
      updateHyperparameters();
    }

    function currentConfig() {
      return {
        environment: environmentSelect.value,
        agent: agentSelect.value,
        learning_rate: learningRateInput.value,
        exploration_probability: explorationInput.value,
      };
    }

    function setStatus(message) {
      saveStatus.textContent = message;
    }

    async function saveConfig() {
      const response = await fetch("{{ url_for('api_config') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(currentConfig()),
      });
      if (!response.ok) {
        setStatus("Could not save selections.");
        return;
      }
      setStatus("Selections saved.");
    }

    async function resetDefaults() {
      applyConfig(defaultConfig);
      const response = await fetch("{{ url_for('api_config_reset') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
      });
      if (!response.ok) {
        setStatus("Could not reset defaults.");
        return;
      }
      setStatus("Defaults restored.");
    }

    applyConfig(savedConfig);
    environmentSelect.addEventListener("change", updateHyperparameters);
    document.getElementById("save-selections").addEventListener("click", saveConfig);
    document.getElementById("reset-defaults").addEventListener("click", resetDefaults);
  </script>
</body>
</html>
